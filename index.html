    <script>
      // 1. ACTIVATE GSAP SCROLL NORMALIZATION & LAG SMOOTHING
      gsap.registerPlugin(ScrollTrigger);
      ScrollTrigger.normalizeScroll(true); // Creates smooth "app-like" scroll feel
      ScrollTrigger.config({ ignoreMobileResize: true }); // Prevents jitter on mobile
      gsap.ticker.lagSmoothing(1000, 16); // Handles CPU spikes gracefully
    </script>

    <style>
      @font-face {
        font-family: 'Dharma Gothic E';
        src: url('/font/DharmaGothicE_Bold_R.otf') format('opentype');
        font-weight: bold;
        font-style: normal;
        font-display: swap;
      }
      
      .font-dharma {
        font-family: 'Dharma Gothic E', sans-serif;
      }

      body {
        font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
        background-color: #ffffff;
        color: #0f172a;
        width: 100%;
      }
      
      /* Mobile-only overflow fix to prevent horizontal sliding */
      @media (max-width: 1024px) {
        html, body {
          overflow-x: hidden;
        }
      }
      
      /* Utility for balanced text wrapping */
      .text-balance {
        text-wrap: balance;
      }

      /* Fluid Typography & Scaling System for Large Screens */
      @media (min-width: 1536px) {
        html {
          /* Scales root font size from 16px (at 2xl) up to 24px (at 4k+) */
          font-size: clamp(16px, 0.5vw + 8px, 24px);
          overflow-x: hidden;
        }
      }
      .perspective-3d {
        perspective: 1200px;
      }
      .preserve-3d {
        transform-style: preserve-3d;
      }
      /* Lenis Recommended CSS */
      html.lenis, html.lenis body {
        height: auto;
      }
      .lenis.lenis-smooth {
        scroll-behavior: auto !important;
      }
      .lenis.lenis-smooth [data-lenis-prevent] {
        overscroll-behavior: contain;
      }
      .lenis.lenis-stopped {
        overflow: hidden;
      }
      .lenis.lenis-scrolling iframe {
        pointer-events: none;
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }

      /* 
       * SERVICE & CTA SECTION FIXES 
       * Apply these classes to your Service/CTA containers if they aren't in the provided files.
       */
      .sticky-wrapper {
        /* Ensures sticky works by preventing overflow clipping on parents */
        overflow: visible !important; 
        height: auto !important;
      }
      
      .cta-responsive {
        /* Logic: Hidden below 1024px, Visible above */
        display: none;
      }
      @media (min-width: 1024px) {
        .cta-responsive {
          display: flex; /* or block */
        }
      }

      /* --- INDUSTRIAL-GRADE PERFORMANCE OPTIMIZATIONS --- */
      
      /* 2. FORCE GPU ACCELERATION */
      .gpu-accelerate {
        will-change: transform;
        transform: translateZ(0);
        backface-visibility: hidden;
      }

      /* 3. OPTIMIZE GLASSMORPHISM */
      .glass-optimized {
        /* Hardware acceleration for glass effects */
        backface-visibility: hidden;
        transform: translateZ(0);
      }

      /* 4. CSS CONTAINMENT (Isolate Reflows) */
      .contain-section {
        contain: paint layout;
      }
